<svg xmlns="http://www.w3.org/2000/svg" width="1228" height="282" viewBox="0 0 1228 282" role="img" aria-labelledby="title desc">
  <title id="title">Capturing prompts snippet</title>
  <desc id="desc">A minimal article-like snippet with shell commands for mitmproxy and an Anthropic base URL.</desc>
  <rect width="1228" height="282" fill="#ffffff"/>
  <text x="8" y="35" font-family="Georgia, 'Times New Roman', serif" font-size="31" fill="#111111">Capturing prompts</text>
  <text x="8" y="91" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#111111">It turned out a lot easier than I thought, thanks to</text>
  <text x="559" y="91" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#444444" text-decoration="underline">mitmproxy</text>
  <text x="673" y="91" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#111111">:</text>
  <rect x="7" y="138" width="1218" height="121" fill="#fafafa" stroke="#b8b8b8"/>
  <text x="20" y="176" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="24" font-weight="700" fill="#555555">$ brew install mitmproxy</text>
  <text x="20" y="210" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="24" font-weight="700" fill="#555555">$ mitmweb --mode reverse:https://api.anthropic.com --listen-port 8000</text>
  <text x="20" y="244" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="24" font-weight="700" fill="#555555">$ ANTHROPIC_BASE_URL=http://localhost:8000/ claude</text>
</svg>
